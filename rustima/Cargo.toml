[package]
name = "rustima"
version = "0.3.0"
edition = "2021"
rust-version = "1.83"
description = "High-performance SARIMAX engine with PyO3 bindings"
license = "GPL-3.0-or-later"

[lib]
name = "rustima"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Linear algebra (dynamic-size matrices)
nalgebra = "0.34"

# Optimization (L-BFGS, Nelder-Mead, L-BFGS-B)
argmin = "0.11"
argmin-math = { version = "0.5", features = ["nalgebra_latest", "vec"] }
anyhow = "1"

# Statistics
statrs = "0.18"

# Parallelism
rayon = "1.10"

# Python bindings
# auto-initialize 제거(2026-07-11): 크레이트 내 Python::with_gil 사용처 0 — 임베딩 불필요.
# 켜두면 manylinux(정적 python) 휠 빌드가 실패해 PyPI 릴리스를 막는다.
pyo3 = { version = "0.28" }
numpy = "0.28"

# Error handling
thiserror = "2"

# Serialization (test fixtures)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
approx = "0.5"

[[bench]]
name = "bench_kalman"
harness = false

[[bench]]
name = "bench_fit"
harness = false

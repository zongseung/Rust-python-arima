name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust tests
        run: cargo test --all-targets

  python-test:
    name: Python Tests (Tier A + Contract + Smoke)
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install deps
        run: |
          uv venv .venv
          uv pip install numpy pytest statsmodels scipy pandas

      - name: Build wheel and install
        run: |
          uv pip install maturin
          CARGO_TARGET_DIR=target_wheel uv run maturin build --out /tmp/wheels
          uv pip install --force-reinstall /tmp/wheels/sarimax_rs-*.whl

      - name: Run Python tests (excluding nightly)
        run: .venv/bin/python -m pytest python_tests/ -m "not nightly" -v --tb=short
